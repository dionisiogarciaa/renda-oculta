{% extends "base.html" %}
{% block title %}Criar conta{% endblock %}
{% block content %}
<div class="auth-card">
    <div class="pagina-cab">
        <h1>Criar conta</h1>
        <p>Seus registros ficam guardados na sua conta e só você vê.</p>
    </div>
    <section class="card-rc">
        <form method="POST" action="{{ url_for('auth.cadastro') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label" for="nome">Seu nome</label>
                <input class="form-control" id="nome" name="nome" value="{{ dados.get('nome', '') }}" autocomplete="name" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="login">E-mail ou telefone (com DDD)</label>
                <input class="form-control" id="login" name="login" value="{{ dados.get('login', '') }}" autocomplete="username" required>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-6">
                    <label class="form-label" for="comunidade">Comunidade <span class="muda">(opcional)</span></label>
                    <input class="form-control" id="comunidade" name="comunidade" value="{{ dados.get('comunidade', '') }}">
                </div>
                <div class="col-6">
                    <label class="form-label" for="municipio">Município <span class="muda">(opcional)</span></label>
                    <input class="form-control" id="municipio" name="municipio" value="{{ dados.get('municipio', '') }}">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="senha">Senha (mínimo 8 caracteres)</label>
                <input class="form-control" id="senha" name="senha" type="password" autocomplete="new-password" minlength="8" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="senha2">Repita a senha</label>
                <input class="form-control" id="senha2" name="senha2" type="password" autocomplete="new-password" minlength="8" required>
            </div>
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="consentimento" name="consentimento" value="1" required>
                <label class="form-check-label" for="consentimento">
                    Aceito que meus dados de produção sejam guardados para calcular o meu
                    valor econômico. Posso exportar ou excluir tudo a qualquer momento.
                </label>
            </div>
            <button class="btn btn-rc w-100" type="submit">Criar conta</button>
        </form>
        <p class="mt-3 mb-0">Já tem conta? <a href="{{ url_for('auth.entrar') }}">Entrar</a></p>
    </section>
</div>
{% endblock %}
