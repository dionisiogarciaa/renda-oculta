{% extends "base.html" %}

{% block title %}Tabela de preços{% endblock %}

{% block content %}

    <a class="link" style="padding-top: 0" href="{{ url_for('mais') }}">← Voltar</a>

    <h1>Tabela de preços — CEASA</h1>

    <p class="sub">
        Preços de referência usados no cálculo. Toque numa categoria para
        ver os produtos.
    </p>

    <div style="margin-top: 20px">

        {% for categoria in categorias %}
            <a class="menu" href="{{ url_for('tabela_categoria', categoria=categoria) }}">
                <i>🌿</i> {{ categoria }}
            </a>
        {% endfor %}

    </div>

{% endblock %}
